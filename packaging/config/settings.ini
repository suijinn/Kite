# Kite settings.
#
# このフォルダ (kite.exe の隣の config) が在ることが、設定を exe と同じ場所に
# 置く合図になっている。フォルダごと消せば %APPDATA%\Kite が使われる。
#
# 中身は Kite が終了時に書き直す。ここに書いた値は起動時に読まれ、書き戻す際に
# 既定値も併せて並ぶので、このファイルがそのまま設定の一覧になる。
# keys.ini / sessions.ini / bookmarks.ini も同じフォルダに作られる。
#
# 主なものは Ctrl+, の設定画面からも変えられる（変えた時点でここへ書き戻される）。

[ui]
# theme      = dark      ; dark または light
# language   = auto      ; auto / en / ja
# font_family= Yu Gothic UI
# font_size  = 13        ; 既定の文字サイズ（8〜24 の整数）。Ctrl+0 が戻る先
# font_scale = 1.0       ; Ctrl++ / Ctrl+- が書き換える倍率。上の値に掛かる
# new_tab_position = end ; end（末尾）または after_current（現在のタブの右）
# tab_bar_position = top ; top（一覧の上・横並び）または left（一覧の左・縦並び）
# tab_bar_width   = 170  ; 縦置きにしたときのタブバーの幅。ペインの半分が上限
# open_archives   = true  ; ZIP を一覧の中で開く。false なら関連付けられたアプリに渡す

# [view]
# sort       = name      ; name / ext / size / date
# sort_desc  = false
# dirs_first = true
# show_hidden= false
# group      = false     ; 並べ替えの基準ごとに見出しでまとめる（Ctrl+Shift+G）

# 一覧の列。<列>:<幅>:<0=隠す|1=出す> を並べた順が画面の並び。名前の列は常に
# 先頭で、残りの幅を全部取るのでここには書かない。見出しをドラッグしても同じ。
# 幅を既定に戻すのは Ctrl+Alt+0（縁のダブルクリックならその列だけ）。
# [columns]
# column = ext:58:1
# column = size:84:1
# column = date:124:1
# column = age:84:1     ; 「5 分前」「3 日前」。更新日時の列と同時に出せる
