# タグから Windows 版をビルドし、GitHub Releases に添付する。
#
# 入口は 3 つあるが実体はこのワークフロー 1 つで、どこから来ても同じ経路を通る:
#   - workflow_call     … tag.yml がタグを作った直後に呼ぶ(通常のリリース経路)
#   - push (tags)       … 手で打ったタグの救済
#   - workflow_dispatch … 既存タグに対する再実行(Actions 画面から)
#
# tag.yml の「タグ push」でこのワークフローを連鎖起動することはできない。
# GITHUB_TOKEN で起こしたイベントは新しいワークフローを起動しない、という
# GitHub の再帰防止の仕様があるため(tag.yml は成功してタグもできるのに release が
# 走らず、Release だけ作られない状態になる)。PAT を持たせれば push でも連鎖するが、
# 資格情報を増やさずに済む workflow_call を採る。
#
# ビルドは Ninja プリセットではなく Visual Studio ジェネレータを使う。プリセットは
# vcvars を要求し、CI では第三者製アクションへの依存が増えるため。配布バイナリを
# 生成する経路なのでサプライチェーンは公式アクションのみに絞る。
#
# -DKITE_WERROR=ON は付けない。警告 1 つでリリースが止まるのは割に合わない
# (警告ゼロの強制は ci.yml の役目で、main に入る前に済んでいる)。
name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'ビルドするタグ (例: v0.1.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'ビルドするタグ (例: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # windows-latest の既定は pwsh。tag.yml と記法を揃える
    env:
      # workflow_call / workflow_dispatch では inputs.tag、タグ push では ref から取る。
      # workflow_call のとき GITHUB_REF_NAME は呼び出し元の main になるので使えない
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # 版は ci.yml のコメントの通り Node.js 24 で動くメジャーに揃える
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: タグと CMakeLists.txt のバージョンの一致を確認
        run: |
          tag="${TAG#v}"
          version=$(sed -n 's/^project(Kite VERSION \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' CMakeLists.txt)
          if [ "$tag" != "$version" ]; then
            echo "::error::タグ $TAG と CMakeLists.txt の $version が食い違っている"
            exit 1
          fi

      - name: Configure
        # ジェネレータは指定せず CMake に検出させる。windows-latest のイメージが載せる
        # Visual Studio は更新されるため、"Visual Studio 17 2022" のような決め打ちは
        # イメージが次の VS へ上がった日に "could not find any instance of Visual
        # Studio" で壊れる。検出結果はログに出るので追跡できる。
        run: |
          cmake --version
          cmake -S . -B build/ci -A x64

      - name: Build
        run: cmake --build build/ci --config Release

      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure

      - name: 書庫を作る
        # exe 単体では配れない。kite.exe は kite_shellhost.exe を「自分と同じフォルダ」
        # から起動するので、片方だけ置かれるとコンテキストメニューが出なくなる
        # (「シェルメニューを表示できませんでした」)。2 つを 1 つの書庫にまとめて、
        # 別々に落とせる形にしない。
        #
        # 書庫名に版番号を入れるのは、exe に VERSIONINFO リソースが無く、どの版を
        # 展開したのかがファイル名以外から分からないため(リソースを持たせたら
        # 固定名にして latest/download の URL を安定させたほうがよい)。
        #
        # Compress-Archive は PowerShell 同梱。bash の zip はランナーに無い
        shell: pwsh
        run: |
          $stage = "dist/kite-$env:TAG-win-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($exe in 'kite.exe', 'kite_shellhost.exe') {
            $path = "build/ci/Release/$exe"
            if (-not (Test-Path $path)) { throw "$path が無い" }
            Copy-Item $path $stage
          }
          Copy-Item README.md $stage
          # config フォルダを同梱することが「設定は exe の隣」の合図になる
          # (WinFileSystem のコンストラクタ / config::Choose)。同梱しないと展開した
          # だけでは %APPDATA%\Kite に書かれ、zip 1 つで完結しなくなる。
          Copy-Item packaging/config $stage -Recurse
          # 展開先を散らかさないよう、書庫の中は 1 つのフォルダにまとめる。
          # -Path にフォルダ自身を渡すとその名前が書庫の中に残る ("$stage/*" だと
          # 中身だけが入り、Downloads に直接展開した人の手元で 3 つに散る)
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Get-ChildItem "$stage.zip" | Format-List Name, Length

      - name: Release を作成して添付
        # 再実行(workflow_dispatch)でも通るよう、既にある Release には添付し直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/kite-$TAG-win-x64.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG は既にあるので成果物だけ差し替える"
            gh release upload "$TAG" "$asset" --clobber
            exit 0
          fi
          gh release create "$TAG" \
            --title "Kite $TAG" \
            --generate-notes \
            "$asset"
